<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>博客管理后台 - feiyao</title>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@^3.5.0/dist/decap-cms.js"></script>
  <script>
    // 等 CMS 渲染完，找到头像按钮和下拉菜单，直接改 style
    function enhanceUI() {
      // 1. 找头像按钮（包含 GitHub avatar 图片的 button）
      var avatarImg = document.querySelector('img[src*="avatars.githubusercontent"]');
      if (!avatarImg) return setTimeout(enhanceUI, 500);

      var btn = avatarImg.closest('button');
      if (btn && !btn.dataset.enhanced) {
        btn.dataset.enhanced = '1';
        btn.style.borderRadius = '50%';
        btn.style.boxShadow = '0 2px 8px rgba(0,0,0,0.2)';
        btn.style.transition = 'transform .15s, box-shadow .15s';
        btn.style.overflow = 'hidden';
        btn.addEventListener('mouseenter', function() {
          btn.style.transform = 'scale(1.1)';
          btn.style.boxShadow = '0 4px 16px rgba(0,0,0,0.3)';
        });
        btn.addEventListener('mouseleave', function() {
          btn.style.transform = 'scale(1)';
          btn.style.boxShadow = '0 2px 8px rgba(0,0,0,0.2)';
        });
      }

      // 2. 找下拉菜单，注入用户名
      var menu = document.querySelector('ul[role="menu"]');
      if (menu && !menu.dataset.enhanced) {
        menu.dataset.enhanced = '1';
        menu.style.borderRadius = '10px';
        menu.style.boxShadow = '0 4px 24px rgba(0,0,0,0.12)';
        menu.style.overflow = 'hidden';
        menu.style.minWidth = '140px';

        // 尝试从 CMS store 拿用户名
        try {
          var store = CMS.getStore();
          var state = store.getState();
          var user = state && state.auth && state.auth.user;
          var name = (user && (user.name || user.login)) || '';

          if (name && !menu.querySelector('[data-username]')) {
            var li = document.createElement('li');
            li.setAttribute('data-username', '1');
            li.style.cssText = 'text-align:center;color:#555;padding:10px 16px;border-bottom:1px solid #eee;font-weight:500;cursor:default;font-size:14px;';
            li.textContent = name;
            menu.insertBefore(li, menu.firstChild);
          }
        } catch(e) {}
      }

      setTimeout(enhanceUI, 1000);
    }

    enhanceUI();
  </script>
</body>
</html>
